services:
  - type: web
    name: agriwise-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./agriwise.db
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
